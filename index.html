<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>플래피 버드</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #stage {
    position: relative;
    line-height: 0;
  }
  #gameCanvas {
    display: block;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 4px #0f3460;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    color: #d0d0e0;
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gameCanvas"></canvas>
</div>
<div id="hint">스페이스 · 클릭 : 점프 &nbsp;|&nbsp; M : 음악</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---------- 논리 해상도(디자인 좌표계) ----------
const W = 360;
const H = 640;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

// ---------- 게임 상태 ----------
const STATE = { READY: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.READY;

let score = 0;
let pipesPassed = 0;
const popups = [];   // 통과 시 떠오르는 획득 점수 표시
let best = Number(localStorage.getItem('flappyBest') || 0);
const MAX_LIVES = 3;
const INVINCIBLE_FRAMES = 100;   // 피격 후 무적 지속 시간(약 1.7초)
let lives = MAX_LIVES;
let invincible = 0;      // 남은 무적 프레임

let flashAlpha = 0;      // 충돌 화면 플래시
let shake = 0;           // 화면 흔들림 강도
let readyBob = 0;        // 대기화면 새 둥실거림
let frame = 0;

// ---------- 사운드 (WebAudio, 합성음) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
}
function beep(freq, duration, type, vol, glideTo) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + duration);
  gain.gain.setValueAtTime(vol || 0.15, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}
const sfx = {
  flap: () => beep(520, 0.09, 'square', 0.10, 700),
  score: (pts = 1) => beep(760 + pts * 120, 0.12, 'square', 0.12, 1000 + pts * 220),
  hit: () => beep(140, 0.35, 'sawtooth', 0.16, 60),
  hurt: () => beep(330, 0.18, 'square', 0.14, 160)
};

// ---------- 배경음악 (합성 칩튠 루프) ----------
const BPM = 128;
const STEP_DUR = 60 / BPM / 2;   // 8분음표 길이(초)
const MUSIC_VOL = 0.45;

// 0 = 쉼표, 그 외는 MIDI 노트 번호
const MELODY = [
  72, 76, 79, 76,  72, 76, 79, 81,
  79, 76, 74, 76,  72,  0,  0,  0,
  77, 81, 84, 81,  77, 81, 79, 76,
  74, 77, 76, 74,  72,  0,  0,  0
];
const BASS = [
  48, 0, 0, 0,  48, 0, 0, 0,
  43, 0, 0, 0,  43, 0, 0, 0,
  41, 0, 0, 0,  41, 0, 0, 0,
  43, 0, 0, 0,  43, 0, 0, 0
];

let musicGain = null;
let musicTimer = null;
let musicStep = 0;
let nextNoteTime = 0;
let musicOn = localStorage.getItem('flappyMusic') !== 'off';

const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);

function scheduleNote(midi, time, dur, type, vol) {
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(midiToFreq(midi), time);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.015);
  g.gain.setValueAtTime(vol, time + dur * 0.65);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  osc.connect(g).connect(musicGain);
  osc.start(time);
  osc.stop(time + dur + 0.02);
}

function musicScheduler() {
  if (!audioCtx || !musicGain) return;
  // 탭이 백그라운드로 갔다 오면 타이머가 밀리므로 재동기화(음 뭉침 방지)
  if (nextNoteTime < audioCtx.currentTime) nextNoteTime = audioCtx.currentTime + 0.05;

  while (nextNoteTime < audioCtx.currentTime + 0.2) {
    const i = musicStep % MELODY.length;
    if (MELODY[i]) scheduleNote(MELODY[i], nextNoteTime, STEP_DUR * 0.9, 'square', 0.13);
    if (BASS[i]) scheduleNote(BASS[i], nextNoteTime, STEP_DUR * 1.8, 'triangle', 0.18);
    nextNoteTime += STEP_DUR;
    musicStep++;
  }
}

function startMusic() {
  if (!audioCtx || musicTimer) return;
  if (!musicGain) {
    musicGain = audioCtx.createGain();
    musicGain.gain.value = musicOn ? MUSIC_VOL : 0;
    musicGain.connect(audioCtx.destination);
  }
  nextNoteTime = audioCtx.currentTime + 0.1;
  musicStep = 0;
  musicTimer = setInterval(musicScheduler, 25);
}

function setMusicVolume(v) {
  if (!musicGain) return;
  musicGain.gain.setTargetAtTime(musicOn ? v : 0, audioCtx.currentTime, 0.08);
}

function toggleMusic() {
  musicOn = !musicOn;
  localStorage.setItem('flappyMusic', musicOn ? 'on' : 'off');
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startMusic();
  setMusicVolume(state === STATE.GAMEOVER ? MUSIC_VOL * 0.35 : MUSIC_VOL);
}

// ---------- 새 ----------
const bird = {
  x: 90,
  y: H / 2,
  vy: 0,
  radius: 14,
  gravity: 0.26,
  jump: -5.2,
  maxFall: 7.5,
  rotation: 0,
  wing: 0 // 날개 애니메이션 위상
};

// ---------- 파이프 / 난이도 ----------
const pipes = [];
const pipeWidth = 58;
let pipeTimer = 0;
let pipeSpeed = 2.2;

// 점수가 오를수록 기준 간격은 좁아지고, 빨라지고, 파이프가 위아래로 움직인다
// 기준 간격은 변화 폭을 확보할 만큼만 좁아지고, 실제 난이도는 파이프별 변형이 만든다
const GAP_START = 150, GAP_MIN = 128;
const SPEED_START = 2.2, SPEED_MAX = 3.3;
const SPACING = 205;      // 파이프 사이 픽셀 간격(속도와 무관하게 유지)
const WAVE_FROM = 10;     // 이 점수부터 파이프가 흔들리기 시작
const EARLY_STAGE_PIPES = 5;  // 초반 구간으로 취급할 파이프 수

// 좁은 간격일수록 높은 점수를 준다
const GAP_POINT_TIERS = [
  { maxGap: 120, points: 3 },
  { maxGap: 140, points: 2 }
];
function gapPoints(gap) {
  const tier = GAP_POINT_TIERS.find(t => gap < t.maxGap);
  return tier ? tier.points : 1;
}

// 파이프마다 간격을 다르게 뽑아 난이도에 기복을 준다
const GAP_HARD_MIN = 104, GAP_HARD_MAX = 200;
const GAP_VARIANTS = [
  { mul: 1.28, weight: 3 },  // 널널 — 한숨 돌리는 구간
  { mul: 1.06, weight: 5 },
  { mul: 0.88, weight: 4 },  // 빡빡
  { mul: 0.82, weight: 2 }   // 아주 빡빡
];
let lastGapMul = 1;

function pickGapMul() {
  // 초반 몇 개는 넓은 구간만 내보내 적응할 여유를 준다
  if (pipesPassed < 3) return (lastGapMul = GAP_VARIANTS[Math.random() < 0.5 ? 0 : 1].mul);

  const t = Math.min(pipesPassed, 30) / 30;
  const tightBefore = lastGapMul < 0.9;
  const weights = GAP_VARIANTS.map(v => {
    // 점수가 오를수록 좁은 구간이 자주 나온다
    let w = v.weight * (v.mul >= 1 ? 1.6 - 0.8 * t : 0.35 + 1.15 * t);
    // 좁은 구간이 연달아 나오면 불합리하므로, 직후에는 넓은 쪽에 가중치를 준다
    if (tightBefore) w *= v.mul >= 1 ? 3 : 0.35;
    return w;
  });
  let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < GAP_VARIANTS.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return (lastGapMul = GAP_VARIANTS[i].mul);
  }
  return (lastGapMul = 1);
}

// 난이도 진행은 점수가 아니라 통과한 파이프 수를 기준으로 한다
// (점수는 간격에 따라 1~3점씩 붙으므로 진행도와 비례하지 않는다)
function difficulty() {
  const t = Math.min(pipesPassed, 30) / 30;
  return {
    gap: GAP_START - (GAP_START - GAP_MIN) * t,
    speed: SPEED_START + (SPEED_MAX - SPEED_START) * t,
    wave: pipesPassed >= WAVE_FROM ? Math.min(32, (pipesPassed - WAVE_FROM) * 2.2) : 0
  };
}

function pipeTop(pipe) {
  if (!pipe.wave) return pipe.topHeight;
  return pipe.topHeight + Math.sin(frame * 0.028 + pipe.phase) * pipe.wave;
}

// ---------- 배경 (패럴랙스) ----------
const groundHeight = 90;
let groundOffset = 0;
let hillOffset = 0;

const clouds = [];
for (let i = 0; i < 4; i++) {
  clouds.push({
    x: Math.random() * W,
    y: 30 + Math.random() * 130,
    w: 50 + Math.random() * 40,
    speed: 0.15 + Math.random() * 0.15
  });
}

const hills = [];
for (let i = 0; i < 3; i++) {
  hills.push({
    x: i * 220,
    w: 220,
    h: 60 + Math.random() * 40
  });
}

// 배경 파티클(점프 시 살짝 튀는 반짝임)
const particles = [];

function resetGame() {
  bird.y = H / 2;
  bird.vy = 0;
  bird.rotation = 0;
  pipes.length = 0;
  pipeTimer = 0;
  lastGapMul = 1;
  particles.length = 0;
  popups.length = 0;
  score = 0;
  pipesPassed = 0;
  lives = MAX_LIVES;
  invincible = 0;
  flashAlpha = 0;
  shake = 0;
  state = STATE.READY;
  setMusicVolume(MUSIC_VOL);
}

function flap() {
  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  startMusic();

  if (state === STATE.READY) {
    state = STATE.PLAYING;
    bird.vy = bird.jump;
    sfx.flap();
  } else if (state === STATE.PLAYING) {
    bird.vy = bird.jump;
    sfx.flap();
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: bird.x - 10, y: bird.y + 4,
        vx: -1 - Math.random() * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        life: 20 + Math.random() * 10,
        r: 2 + Math.random() * 2
      });
    }
  } else if (state === STATE.GAMEOVER) {
    resetGame();
  }
}

// ---------- 입력 ----------
const MUTE_BTN = { x: W - 40, y: 12, w: 28, h: 28 };

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  } else if (e.code === 'KeyM' || (e.key && e.key.toLowerCase() === 'm')) {
    toggleMusic();
  }
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (W / rect.width);
  const py = (e.clientY - rect.top) * (H / rect.height);

  if (px >= MUTE_BTN.x - 6 && px <= MUTE_BTN.x + MUTE_BTN.w + 6 &&
      py >= MUTE_BTN.y - 6 && py <= MUTE_BTN.y + MUTE_BTN.h + 6) {
    toggleMusic();
    return;
  }
  flap();
});

// ---------- 충돌 판정 ----------
function checkCollision(pipe) {
  const pad = 2; // 살짝 관대한 판정
  const birdLeft = bird.x - bird.radius + pad;
  const birdRight = bird.x + bird.radius - pad;
  const birdTop = bird.y - bird.radius + pad;
  const birdBottom = bird.y + bird.radius - pad;
  const top = pipeTop(pipe);

  if (birdRight > pipe.x && birdLeft < pipe.x + pipeWidth) {
    if (birdTop < top || birdBottom > top + pipe.gap) {
      return true;
    }
  }
  return false;
}

function triggerGameOver() {
  if (state === STATE.GAMEOVER) return;
  state = STATE.GAMEOVER;
  flashAlpha = 0.55;
  shake = 8;
  sfx.hit();
  setMusicVolume(MUSIC_VOL * 0.35); // 게임오버 동안 음악을 살짝 줄임
  saveBest();
}

// 부딪히면 생명을 하나 잃고, 남아 있으면 잠시 무적 상태로 계속 진행한다
function loseLife() {
  if (state !== STATE.PLAYING || invincible > 0) return;
  lives--;
  shake = 8;
  if (lives <= 0) {
    triggerGameOver();
  } else {
    invincible = INVINCIBLE_FRAMES;
    flashAlpha = 0.35;
    sfx.hurt();
  }
}

// ---------- 업데이트 ----------
function update() {
  frame++;
  const d = difficulty();
  pipeSpeed = d.speed;

  if (state !== STATE.GAMEOVER) {
    groundOffset -= pipeSpeed;
    if (groundOffset <= -28) groundOffset += 28;
    hillOffset -= pipeSpeed * 0.35;
    if (hillOffset <= -220) hillOffset += 220;
  }

  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x + c.w < 0) c.x = W + Math.random() * 50;
  });

  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - 0.04);
  if (shake > 0) shake *= 0.85;
  if (shake < 0.1) shake = 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 0.7;
    p.life--;
    if (p.life <= 0) popups.splice(i, 1);
  }

  if (state === STATE.READY) {
    readyBob = Math.sin(frame * 0.06) * 6;
    bird.wing += 0.2;
    return;
  }
  if (state !== STATE.PLAYING) return;

  // 새 물리
  bird.vy += bird.gravity;
  if (bird.vy > bird.maxFall) bird.vy = bird.maxFall;
  bird.y += bird.vy;

  const targetRot = bird.vy < 0 ? -0.45 : Math.min(1.3, bird.vy / bird.maxFall * 1.3);
  bird.rotation += (targetRot - bird.rotation) * 0.15;

  bird.wing += 0.25;

  if (invincible > 0) invincible--;

  // 바닥/천장 충돌 (바닥은 무적이어도 통과할 수 없으므로 위로 튕겨낸다)
  if (bird.y + bird.radius > H - groundHeight) {
    bird.y = H - groundHeight - bird.radius;
    loseLife();
    if (state === STATE.PLAYING) bird.vy = bird.jump * 1.3;
  }
  if (bird.y - bird.radius < 0) {
    bird.y = bird.radius;
    bird.vy = 0;
  }

  // 파이프 생성
  pipeTimer++;
  if (pipeTimer >= Math.round(SPACING / d.speed)) {
    pipeTimer = 0;
    const mul = pickGapMul();
    const gap = Math.max(GAP_HARD_MIN, Math.min(GAP_HARD_MAX, d.gap * mul));
    // 좁은 구간은 덜 흔들리게 해서 과하게 불리해지지 않도록 한다
    const wave = d.wave * Math.min(1, mul);
    const minTop = 55 + wave;
    const maxTop = H - groundHeight - gap - 55 - wave;
    const topHeight = minTop + Math.random() * Math.max(20, maxTop - minTop);
    pipes.push({
      x: W,
      topHeight: topHeight,
      gap: gap,
      wave: wave,
      phase: Math.random() * Math.PI * 2,
      passed: false
    });
  }

  // 파이프 이동 및 처리
  for (let i = pipes.length - 1; i >= 0; i--) {
    const pipe = pipes[i];
    pipe.x -= pipeSpeed;

    if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
      pipe.passed = true;
      pipesPassed++;
      const points = gapPoints(pipe.gap);
      score += points;
      popups.push({ x: bird.x + 22, y: bird.y - 14, life: 45, points: points });
      sfx.score(points);

      // 초반 구간을 지나면 난이도 상승을 멈춘다
      if (pipesPassed >= EARLY_STAGE_PIPES) {
        triggerGameOver();
      }
    }

    if (checkCollision(pipe)) {
      loseLife();
    }

    if (pipe.x + pipeWidth < 0) {
      pipes.splice(i, 1);
    }
  }
}

function saveBest() {
  if (score > best) {
    best = score;
    localStorage.setItem('flappyBest', String(best));
  }
}

// ---------- 그리기 ----------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5ec8e8');
  grad.addColorStop(0.7, '#a9e4f5');
  grad.addColorStop(1, '#cdeefb');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 구름
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, c.w / 3.3, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + c.w * 0.3, c.y + 4, c.w / 3, c.w / 4, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // 먼 언덕(패럴랙스)
  ctx.fillStyle = '#8fd48a';
  for (let pass = 0; pass < 2; pass++) {
    const ox = hillOffset + pass * 220;
    hills.forEach(h => {
      ctx.beginPath();
      const bx = h.x + ox;
      ctx.moveTo(bx - 20, H - groundHeight);
      ctx.quadraticCurveTo(bx + h.w / 2, H - groundHeight - h.h, bx + h.w + 20, H - groundHeight);
      ctx.closePath();
      ctx.fill();
    });
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = '#fff9c4';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function drawPipes() {
  pipes.forEach(pipe => {
    const capH = 26;
    const bodyGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
    bodyGrad.addColorStop(0, '#3fae3f');
    bodyGrad.addColorStop(0.15, '#7ee87e');
    bodyGrad.addColorStop(0.3, '#5fd05f');
    bodyGrad.addColorStop(1, '#2d8a2d');

    const capGrad = ctx.createLinearGradient(pipe.x - 4, 0, pipe.x + pipeWidth + 4, 0);
    capGrad.addColorStop(0, '#348f34');
    capGrad.addColorStop(0.2, '#8ef08e');
    capGrad.addColorStop(0.35, '#6fda6f');
    capGrad.addColorStop(1, '#256b25');

    const top = pipeTop(pipe);

    // 위쪽 파이프
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(pipe.x, 0, pipeWidth, top - capH);
    ctx.fillStyle = capGrad;
    roundRect(pipe.x - 4, top - capH, pipeWidth + 8, capH, 5);
    ctx.fill();

    // 아래쪽 파이프
    const bottomY = top + pipe.gap;
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(pipe.x, bottomY + capH, pipeWidth, H - groundHeight - (bottomY + capH));
    ctx.fillStyle = capGrad;
    roundRect(pipe.x - 4, bottomY, pipeWidth + 8, capH, 5);
    ctx.fill();

    // 테두리
    ctx.strokeStyle = 'rgba(20,70,20,0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(pipe.x, 0, pipeWidth, top - capH);
    ctx.strokeRect(pipe.x, bottomY + capH, pipeWidth, H - groundHeight - (bottomY + capH));
  });
}

function drawGround() {
  const grad = ctx.createLinearGradient(0, H - groundHeight, 0, H);
  grad.addColorStop(0, '#ecdf9f');
  grad.addColorStop(1, '#d8c374');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - groundHeight, W, groundHeight);

  ctx.fillStyle = '#9fce6a';
  ctx.fillRect(0, H - groundHeight, W, 8);
  ctx.fillStyle = '#7fb84f';
  for (let x = groundOffset; x < W; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, H - groundHeight + 8);
    ctx.lineTo(x + 5, H - groundHeight);
    ctx.lineTo(x + 10, H - groundHeight + 8);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(120,95,40,0.35)';
  for (let x = groundOffset - 6; x < W; x += 28) {
    ctx.fillRect(x, H - groundHeight + 26, 14, 5);
  }
}

// 몸통 + 머리를 하나의 실루엣으로 채운다(경계선이 보이지 않게)
function birdSilhouette(rr) {
  ctx.beginPath();
  ctx.ellipse(0, 0, rr, rr * 0.86, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(rr * 0.42, -rr * 0.44, rr * 0.6, 0, Math.PI * 2);
  ctx.fill();
}

function drawBird() {
  const bobY = state === STATE.READY ? readyBob : 0;
  const r = bird.radius;
  const flap = Math.sin(bird.wing); // -1 ~ 1

  ctx.save();
  // 무적 동안 깜빡여서 피격 상태임을 알린다
  if (invincible > 0) ctx.globalAlpha = Math.floor(frame / 4) % 2 ? 0.25 : 0.95;
  ctx.translate(bird.x, bird.y + bobY);
  ctx.rotate(bird.rotation);

  // 바닥 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.beginPath();
  ctx.ellipse(0, r + 7, r * 0.8, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // 꼬리 깃털 3장
  [
    { y: -5.5, len: 7, w: 4,   c: '#e08d0c' },
    { y: 0,    len: 8, w: 4.5, c: '#ffbe2e' },
    { y: 5,    len: 6, w: 3.5, c: '#e08d0c' }
  ].forEach(t => {
    ctx.fillStyle = t.c;
    ctx.beginPath();
    ctx.moveTo(-r * 0.55, t.y - t.w * 0.5);
    ctx.quadraticCurveTo(-r - t.len, t.y - t.w, -r - t.len, t.y);
    ctx.quadraticCurveTo(-r - t.len, t.y + t.w, -r * 0.55, t.y + t.w * 0.5);
    ctx.closePath();
    ctx.fill();
  });

  // 외곽선(살짝 큰 실루엣을 아래에 깔아 테두리처럼)
  ctx.fillStyle = '#c97c0d';
  birdSilhouette(r + 1.6);

  // 몸통 + 머리
  const bodyGrad = ctx.createRadialGradient(-4, -7, 2, 2, 2, r + 8);
  bodyGrad.addColorStop(0, '#fff3b8');
  bodyGrad.addColorStop(0.45, '#ffd23f');
  bodyGrad.addColorStop(1, '#f0a614');
  ctx.fillStyle = bodyGrad;
  birdSilhouette(r);

  // 배
  ctx.fillStyle = 'rgba(255,252,230,0.55)';
  ctx.beginPath();
  ctx.ellipse(1, r * 0.42, r * 0.52, r * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();

  // 머리 깃털(볏) 2가닥
  ctx.strokeStyle = '#f0a614';
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(r * 0.28, -r * 0.98);
  ctx.quadraticCurveTo(r * 0.02, -r * 1.42, -r * 0.16, -r * 1.32);
  ctx.moveTo(r * 0.52, -r * 0.9);
  ctx.quadraticCurveTo(r * 0.32, -r * 1.28, r * 0.14, -r * 1.2);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // 날개 (퍼덕임)
  ctx.save();
  ctx.translate(-4, -0.5);
  ctx.rotate(-0.2 + flap * 0.3);
  const ws = 1 + Math.abs(flap) * 0.12;
  ctx.fillStyle = '#b86c05';
  ctx.beginPath();
  ctx.ellipse(0, 0, 8.4 * ws, 5.8 * ws, 0, 0, Math.PI * 2);
  ctx.fill();
  const wingGrad = ctx.createLinearGradient(0, -6, 0, 6);
  wingGrad.addColorStop(0, '#ffc247');
  wingGrad.addColorStop(1, '#ee9209');
  ctx.fillStyle = wingGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 7.4 * ws, 4.9 * ws, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(150,85,5,0.55)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-1 - i * 2.2, -2.2);
    ctx.lineTo(-3.2 - i * 2.2, 2.6);
    ctx.stroke();
  }
  ctx.restore();

  // 부리 (하나의 덩어리 + 입선)
  ctx.fillStyle = '#ff9a1f';
  ctx.beginPath();
  ctx.moveTo(10, -8.8);
  ctx.quadraticCurveTo(21.5, -6.5, 21, -4.9);
  ctx.quadraticCurveTo(18.5, -1.3, 10, -1.1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#d4700a';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(11.5, -5.1);
  ctx.lineTo(20.3, -5.0);
  ctx.stroke();

  // 눈
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(7, -7.5, 4.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,120,20,0.45)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.arc(8.8, -7.5, 2.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(9.5, -8.4, 0.85, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.85);
  ctx.bezierCurveTo(x - s * 1.3, y - s * 0.2, x - s * 0.55, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.1, x + s * 1.3, y - s * 0.2, x, y + s * 0.85);
  ctx.closePath();
}

function drawLives() {
  for (let i = 0; i < MAX_LIVES; i++) {
    const x = 26 + i * 24;
    const filled = i < lives;
    // 남은 생명이 1개면 마지막 하트를 맥동시켜 경고한다
    const pulse = filled && lives === 1 ? 1 + Math.sin(frame * 0.18) * 0.12 : 1;
    heartPath(x, 26, 8 * pulse);
    ctx.fillStyle = filled ? '#ff4d5e' : 'rgba(255,255,255,0.22)';
    ctx.fill();
    ctx.strokeStyle = filled ? 'rgba(120,0,15,0.55)' : 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

const POINT_COLORS = { 1: '#ffffff', 2: '#ffe066', 3: '#ff9a3c' };

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';
  popups.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.font = `bold ${16 + p.points * 3}px Arial`;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.strokeText('+' + p.points, p.x, p.y);
    ctx.fillStyle = POINT_COLORS[p.points];
    ctx.fillText('+' + p.points, p.x, p.y);
    ctx.globalAlpha = 1;
  });
}

function drawScore() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 46px Arial';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.strokeText(score, W / 2, 80);
  ctx.fillStyle = '#fff';
  ctx.fillText(score, W / 2, 80);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawPanel(cy, lines) {
  ctx.textAlign = 'center';
  const boxH = 36 + lines.length * 36;
  const boxW = 280;
  ctx.fillStyle = 'rgba(15,25,45,0.7)';
  roundRect(W / 2 - boxW / 2, cy - boxH / 2, boxW, boxH, 16);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  roundRect(W / 2 - boxW / 2, cy - boxH / 2, boxW, boxH, 16);
  ctx.stroke();

  lines.forEach((line, i) => {
    ctx.font = i === 0 ? 'bold 28px Arial' : '17px Arial';
    ctx.fillStyle = i === 0 ? '#ffe066' : '#f0f0f5';
    ctx.fillText(line, W / 2, cy - boxH / 2 + 42 + i * 34);
  });
}

function drawMuteButton() {
  const { x, y, w, h } = MUTE_BTN;
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = 'rgba(15,25,45,0.55)';
  roundRect(x, y, w, h, 8);
  ctx.fill();

  const cx = x + w / 2 - 3, cy = y + h / 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy - 2.5);
  ctx.lineTo(cx - 2, cy - 2.5);
  ctx.lineTo(cx + 2, cy - 6);
  ctx.lineTo(cx + 2, cy + 6);
  ctx.lineTo(cx - 2, cy + 2.5);
  ctx.lineTo(cx - 5, cy + 2.5);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  if (musicOn) {
    ctx.beginPath();
    ctx.arc(cx + 3, cy, 4.5, -0.9, 0.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + 3, cy, 7.5, -0.8, 0.8);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx + 5, cy - 4);
    ctx.lineTo(cx + 11, cy + 4);
    ctx.moveTo(cx + 11, cy - 4);
    ctx.lineTo(cx + 5, cy + 4);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0.3) {
    const dx = (Math.random() - 0.5) * shake;
    const dy = (Math.random() - 0.5) * shake;
    ctx.translate(dx, dy);
  }

  drawBackground();
  drawPipes();
  drawParticles();
  drawGround();
  drawBird();
  drawPopups();

  if (state === STATE.PLAYING) {
    drawScore();
    drawLives();
  } else if (state === STATE.READY) {
    drawLives();
    drawPanel(H * 0.68, ['플래피 버드', `생명 ${MAX_LIVES}개 · 탭 / 클릭 / 스페이스로 시작`]);
  } else if (state === STATE.GAMEOVER) {
    drawScore();
    drawLives();
    drawPanel(H / 2, ['게임 오버', `점수 ${score}  ·  최고 ${best}`, '탭하면 다시 시작']);
  }

  drawMuteButton();

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

// ---------- 메인 루프 (델타타임 보정, 60fps 기준) ----------
let lastTime = performance.now();
let acc = 0;
const STEP = 1000 / 60;

function loop(now) {
  let delta = now - lastTime;
  lastTime = now;
  if (delta > 200) delta = STEP; // 탭 전환 등으로 인한 큰 점프 방지
  acc += delta;

  let steps = 0;
  while (acc >= STEP && steps < 5) {
    update();
    acc -= STEP;
    steps++;
  }

  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(loop); });
</script>
